[build-system]
requires = [ "setuptools>=84.0.0", "wheel",]
build-backend = "setuptools.build_meta"

[project]
name = "systems-manager"
version = "2.2.6"
description = "Systems Manager will update your system and install/upgrade applications. Additionally, as allow AI to perform these activities as an MCP Server"
readme = "README.md"
classifiers = [ "Development Status :: 5 - Production/Stable", "License :: Public Domain", "Environment :: Console", "Operating System :: POSIX :: Linux", "Programming Language :: Python :: 3",]
requires-python = ">=3.12,<3.15"
dependencies = [ "agent-connector-sdk[mcp]>=0.4.1,<1.0.0", "pydantic>=2.14.1", "psutil>=7.2.2", "distro>=1.9.0", "requests>=2.34.2",]
[[project.authors]]
name = "Repository Maintainers"
email = "maintainers@knuckles.team"

[project.license]
text = "MIT"

[project.optional-dependencies]
mcp = [ "agent-connector-sdk[mcp]>=0.4.1,<1.0.0",]
all = [ "agent-connector-sdk[mcp]>=0.4.1,<1.0.0",]
test = [ "pytest>=9.1.1", "pytest-asyncio>=1.4.0",]

[project.scripts]
systems-manager = "systems_manager.systems_manager:main"
systems-manager-mcp = "systems_manager.mcp_server:mcp_server"
systems-manager-helper = "systems_manager.sudo_helper:main"

[project.entry-points."agent_connector_sdk.skill_providers"]
systems-manager = "systems_manager.skills"

[project.entry-points."agent_connector_sdk.ontology_providers"]
systems-manager = "systems_manager.ontology"

# The one declared connector identity: the fleet name (SDK-CONNECTOR-CONTROL-R071).
[project.entry-points."agent_connector_sdk.connector"]
systems-manager-mcp = "systems_manager"

[tool.uv.workspace]
members = ["."]

[tool.setuptools]
include-package-data = true

[tool.codespell]
ignore-words-list = "fo"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true

[tool.setuptools.package-data]
systems_manager = [ "agent_data/**", "prompts/**", "skills/**", "ontology/**", "connectors/**",]

[tool.setuptools.exclude-package-data]
systems_manager = [ "agent_data/*.db", "agent_data/*.sqlite*", "agent_data/chats", "agent_data/CRON_LOG.md", "agent_data/MEMORY.md", "agent_data/USER.md",]

[tool.ruff.lint]
select = [ "E", "F", "I", "UP", "B",]
ignore = [ "E402", "E501", "B008",]

[tool.setuptools.packages.find]
where = [ ".",]

[tool.vulture]
ignore_names = ["request", "config"]

[tool.uv]
override-dependencies = [
    "fastmcp-slim[client,server]>=4.1.0",
]

[tool.pipelines_hooks.ste]
exempt = ["specs/*", "specs/**/*"]

[tool.pipelines.codespell]
ignore_words = ["callin"]

[tool.pipelines.container]
image_var = "SYSTEMS_MANAGER_MCP_IMAGE_DIGEST"
restart = "unless-stopped"
tmpfs_size = "128m"
env_file_mode = "none"
compose_host = {env = "SYSTEMS_MANAGER_MCP_BIND_ADDRESS", default = "127.0.0.1"}
publish_port = {env = "SYSTEMS_MANAGER_MCP_PORT", default = 8000}
container_name = false
hostname = false
health_timeout = "5s"
health_command_timeout = 3
compose_env = [
    "AUTH_TYPE=${AUTH_TYPE:?authenticated MCP transport required}",
    "MCP_TLS_TERMINATED=${MCP_TLS_TERMINATED:?verified TLS boundary required}",
    "MCP_TRUSTED_PROXY_CIDRS=${MCP_TRUSTED_PROXY_CIDRS:?trusted ingress CIDRs required}",
    "MCP_ALLOWED_HOSTS=${MCP_ALLOWED_HOSTS:?MCP Host allowlist required}",
    "FASTMCP_SERVER_AUTH_STATIC_TOKENS_REF=${FASTMCP_SERVER_AUTH_STATIC_TOKENS_REF:-}",
    "FASTMCP_SERVER_AUTH_JWT_JWKS_URI=${FASTMCP_SERVER_AUTH_JWT_JWKS_URI:-}",
    "FASTMCP_SERVER_AUTH_JWT_ISSUER=${FASTMCP_SERVER_AUTH_JWT_ISSUER:-}",
    "FASTMCP_SERVER_AUTH_JWT_AUDIENCE=${FASTMCP_SERVER_AUTH_JWT_AUDIENCE:-}",
    "SYSTEMS_MANAGER_FILESYSTEM_ROOT=/workspace",
    "SYSTEMS_MANAGER_ALLOW_HOST_MUTATIONS=${SYSTEMS_MANAGER_ALLOW_HOST_MUTATIONS:-false}",
    "SYSTEMS_MANAGER_ALLOW_FILESYSTEM_MUTATIONS=${SYSTEMS_MANAGER_ALLOW_FILESYSTEM_MUTATIONS:-false}",
    "SYSTEMS_MANAGER_ALLOW_SENSITIVE_READS=${SYSTEMS_MANAGER_ALLOW_SENSITIVE_READS:-false}",
    "SYSTEMS_MANAGER_ALLOW_NETWORK_PROBES=${SYSTEMS_MANAGER_ALLOW_NETWORK_PROBES:-false}",
]
limits = {mcp = {memory_limit_env = "", memory_limit = "1g", cpu_limit_env = "", cpu_limit = "1.0"}}
[[tool.pipelines.container.state_volumes]]
name = "systems-manager-mcp-state"
target = "/workspace"

name: Windows CI

# Runs the full test suite on a real Windows interpreter. Blocking: a red run is a Windows regression.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows tests
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.11.7'
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync test environment
        run: uv sync --extra test

      - name: Import the package on Windows
        run: uv run python -c "import systems_manager, systems_manager.systems_manager, systems_manager.mcp_server"

      - name: Unit tests
        run: uv run python -m pytest tests -q --tb=short --timeout=120
